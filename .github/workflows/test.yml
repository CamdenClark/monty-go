name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Monty worker
        run: npm install --no-save @pydantic/monty-linux-x64-gnu@0.0.21
      - name: Test
        env:
          MONTY_BIN: ${{ github.workspace }}/node_modules/@pydantic/monty-linux-x64-gnu/monty
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

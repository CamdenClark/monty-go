name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MONTY_REQUIRE_INTEGRATION: '1'
      MONTY_CACHE_DIR: ${{ runner.temp }}/monty-go-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Clean-cache installation and examples smoke test
        env:
          MONTY_AUTO_INSTALL_TEST: '1'
          MONTY_CACHE_DIR: ${{ runner.temp }}/monty-go-cache
        run: go test -run '^TestIntegrationAutoInstall$' .
      - name: Provision pinned runtime
        env:
          MONTY_CACHE_DIR: ${{ runner.temp }}/monty-go-cache
        run: go run ./cmd/monty-install
      - name: Test
        env:
          MONTY_CACHE_DIR: ${{ runner.temp }}/monty-go-cache
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

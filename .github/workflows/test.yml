name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    env:
      MONTY_CACHE_DIR: ${{ runner.temp }}/monty-go-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test automatic runtime installation
        env:
          MONTY_AUTO_INSTALL_TEST: '1'
        run: go test -run '^TestIntegrationAutoInstall$' .
      - name: Test installer command reuse
        run: go run ./cmd/monty-install
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
